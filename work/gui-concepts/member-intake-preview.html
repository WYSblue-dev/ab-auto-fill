.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        &lt;/section&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mi-source&quot; id=&quot;mi-source&quot;&gt;Source: Morgan-Example-ORGANIZED.pdf&lt;/div&gt;
      &lt;label class=&quot;mi-confirm&quot; id=&quot;mi-override&quot;&gt;&lt;input id=&quot;mi-checked&quot; type=&quot;checkbox&quot;&gt;&lt;span&gt;I checked the existing record and confirmed this is a different person.&lt;/span&gt;&lt;/label&gt;

        &lt;button type=&quot;button&quot; class=&quot;mi-primary&quot; id=&quot;mi-new-person&quot; disabled&gt;Review sending as a new person&lt;/button&gt;
        &lt;button type=&quot;button&quot; id=&quot;mi-recheck-button&quot; hidden&gt;Check revised details&lt;/button&gt;
      &lt;/div&gt;
    &lt;/main&gt;
  &lt;/div&gt;
  &lt;section class=&quot;mi-modal&quot; id=&quot;mi-confirm-panel&quot; role=&quot;region&quot; aria-label=&quot;Confirm sample action&quot; hidden&gt;
    &lt;h2 id=&quot;mi-confirm-title&quot;&gt;Review this submission&lt;/h2&gt;
    &lt;p id=&quot;mi-confirm-destination&quot;&gt;Destination: Example local · Membership campaign&lt;/p&gt;
    &lt;ul id=&quot;mi-confirm-names&quot;&gt;&lt;/ul&gt;
    &lt;label id=&quot;mi-reason-label&quot; hidden&gt;Reason for creating a separate person&lt;input type=&quot;text&quot; id=&quot;mi-reason&quot; style=&quot;display:block;width:100%;padding:10px;margin-top:8px&quot;&gt;&lt;/label&gt;
    &lt;span class=&quot;mi-subtle&quot; id=&quot;mi-confirm-note&quot;&gt;Design preview only. No Action Builder request will be made.&lt;/span&gt;
    &lt;div class=&quot;mi-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;mi-cancel&quot;&gt;Back to review&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;mi-primary&quot; id=&quot;mi-confirm-button&quot;&gt;Confirm sample submission&lt;/button&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;footer class=&quot;mi-footer&quot;&gt;&lt;span id=&quot;mi-footer-status&quot;&gt;Destination: Example local · Membership campaign&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;mi-primary&quot; id=&quot;mi-batch-send&quot;&gt;Check and submit batch&lt;/button&gt;&lt;/footer&gt;
  &lt;div id=&quot;mi-notice&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;member-intake-concept&#x27;);
      const el = (id) =&gt; root.querySelector(&#x27;#&#x27; + id);
      const people = [
        {name:&#x27;Morgan Example&#x27;, email:&#x27;morgan@example.test&#x27;, phone:&#x27;(202) 555-0123&#x27;, status:&#x27;pending&#x27;, lookup:&#x27;match&#x27;, receipt:&#x27;action_builder:22222222-2222-4222-8222-222222222222&#x27;},
        {name:&#x27;Taylor Example&#x27;, email:&#x27;taylor@example.test&#x27;, phone:&#x27;(202) 555-0145&#x27;, status:&#x27;pending&#x27;, lookup:&#x27;clear&#x27;, receipt:&#x27;action_builder:33333333-3333-4333-8333-333333333333&#x27;},
        {name:&#x27;Casey Example&#x27;, email:&#x27;casey@example.test&#x27;, phone:&#x27;(202) 555-0187&#x27;, status:&#x27;pending&#x27;, lookup:&#x27;clear&#x27;, receipt:&#x27;action_builder:44444444-4444-4444-8444-444444444444&#x27;}
      ];
      let selected = 0, editing = false, action = &#x27;&#x27;, view = &#x27;preview&#x27;, batchRun = false;
      const appearance = {accent:&#x27;Blue&#x27;, spacing:&#x27;Comfortable&#x27;};
      const isHeld = p =&gt; p.status === &#x27;review&#x27; || p.status === &#x27;changed&#x27;;
      const labels = {pending:&#x27;Ready to be submitted&#x27;, review:&#x27;Needs review&#x27;, changed:&#x27;Check again&#x27;, sent:&#x27;Submitted&#x27;, discarded:&#x27;Discarded&#x27;};
      function badge(text, kind) { const node=document.createElement(&#x27;span&#x27;); node.className=&#x27;mi-pill mi-&#x27;+kind; node.textContent=text; return node; }
      function notice(message) { el(&#x27;mi-notice&#x27;).textContent = message; }
      function showHeld(index) {
        const next = typeof index === &#x27;number&#x27; ? index : people.findIndex(isHeld);
        if(next === -1) { notice(&#x27;No sample records need review.&#x27;); return; }
        selected=next; editing=false; action=&#x27;&#x27;; el(&#x27;mi-confirm-panel&#x27;).hidden=true; el(&#x27;mi-checked&#x27;).checked=false; view=&#x27;review&#x27;; notice(&#x27;&#x27;); render();
      }
      function renderLists() {
        el(&#x27;mi-preview-rows&#x27;).replaceChildren();
        el(&#x27;mi-result-rows&#x27;).replaceChildren();
        people.forEach((person,index) =&gt; {
          if(person.status !== &#x27;discarded&#x27; &amp;&amp; person.status !== &#x27;sent&#x27;) {
            const row=document.createElement(&#x27;tr&#x27;);
            const name=document.createElement(&#x27;td&#x27;);
            const strong=document.createElement(&#x27;strong&#x27;); strong.textContent=person.name;
            const source=document.createElement(&#x27;span&#x27;); source.className=&#x27;mi-subtle&#x27;; source.textContent=person.name.replaceAll(&#x27; &#x27;,&#x27;-&#x27;)+&#x27;-ORGANIZED.pdf&#x27;; name.append(strong,source);
            const contact=document.createElement(&#x27;td&#x27;);
            const email=document.createElement(&#x27;span&#x27;); email.textContent=person.email;
            const phone=document.createElement(&#x27;span&#x27;); phone.textContent=person.phone;
            const details=document.createElement(&#x27;details&#x27;); const summary=document.createElement(&#x27;summary&#x27;); summary.textContent=&#x27;More contact details&#x27;;
            const address=document.createElement(&#x27;div&#x27;); address.textContent=&#x27;123 Example Street, Washington, DC 20001 · Middle initial: A&#x27;; details.append(summary,address); contact.append(email,phone,details);
            const state=document.createElement(&#x27;td&#x27;); state.append(badge(labels[person.status],isHeld(person)?&#x27;warning&#x27;:&#x27;ready&#x27;));
            row.append(name,contact,state); el(&#x27;mi-preview-rows&#x27;).append(row);
          }
        });
        el(&#x27;mi-preview-empty&#x27;).hidden = el(&#x27;mi-preview-rows&#x27;).children.length &gt; 0;
        el(&#x27;mi-preview-title&#x27;).textContent = people.some(p=&gt;p.status===&#x27;pending&#x27;) ? &#x27;Paperwork is ready to process&#x27; : &#x27;No new candidates to submit&#x27;;
        people.map((person,index)=&gt;({person,index})).sort((a,b)=&gt;(a.person.status===&#x27;sent&#x27;?0:1)-(b.person.status===&#x27;sent&#x27;?0:1)).forEach(({person,index})=&gt;{
          const row=document.createElement(&#x27;tr&#x27;);
          const name=document.createElement(&#x27;td&#x27;); name.textContent=person.name;
          const result=document.createElement(&#x27;td&#x27;); result.append(badge(labels[person.status],isHeld(person)?&#x27;warning&#x27;:person.status===&#x27;sent&#x27;?&#x27;good&#x27;:&#x27;neutral&#x27;));
          const context=document.createElement(&#x27;span&#x27;); context.className=&#x27;mi-subtle&#x27;; context.textContent=person.status===&#x27;sent&#x27;?&#x27;Confirmed in this sample batch&#x27;:isHeld(person)?&#x27;Possible existing person — not submitted&#x27;:person.status===&#x27;discarded&#x27;?&#x27;Removed from this import&#x27;:&#x27;Check has not run&#x27;; result.append(context);
          const details=document.createElement(&#x27;td&#x27;);
          if(person.status===&#x27;sent&#x27;||isHeld(person)) {
            const button=document.createElement(&#x27;button&#x27;); button.type=&#x27;button&#x27;; button.textContent=person.status===&#x27;sent&#x27;?&#x27;View receipt&#x27;:&#x27;Review person&#x27;;
            button.onclick=()=&gt;{ if(isHeld(person)) showHeld(index); else { selected=index; editing=false; view=&#x27;detail&#x27;; notice(&#x27;Viewing a completed sample submission. No approval is needed.&#x27;); render(); } }; details.append(button);
          }
          row.append(name,result,details); el(&#x27;mi-result-rows&#x27;).append(row);
        });
        const sent=people.filter(p=&gt;p.status===&#x27;sent&#x27;).length;
        const held=people.filter(isHeld).length;
        el(&#x27;mi-results-counts&#x27;).replaceChildren(badge(sent+&#x27; submitted&#x27;,&#x27;good&#x27;),badge(held+&#x27; need review&#x27;,held?&#x27;warning&#x27;:&#x27;neutral&#x27;));
        el(&#x27;mi-review-held&#x27;).textContent=&#x27;Review &#x27;+held+&#x27; flagged &#x27;+(held===1?&#x27;person&#x27;:&#x27;people&#x27;);
        el(&#x27;mi-review-held&#x27;).hidden=held===0;
      }
      function openAction(next) {
        action = next;
        const discard = next === &#x27;discard&#x27;;
        el(&#x27;mi-confirm-panel&#x27;).hidden = false;
        el(&#x27;mi-review-panel&#x27;).hidden = true;
        el(&#x27;mi-import-panel&#x27;).hidden = true;
        el(&#x27;mi-confirm-title&#x27;).textContent = discard ? &#x27;Discard this import?&#x27; : &#x27;Review this submission&#x27;;
        el(&#x27;mi-confirm-destination&#x27;).hidden = discard;
        el(&#x27;mi-confirm-names&#x27;).replaceChildren();
        const names = [people[selected]];
        names.forEach(p =&gt; { const li=document.createElement(&#x27;li&#x27;); li.textContent=p.name; el(&#x27;mi-confirm-names&#x27;).append(li); });
        el(&#x27;mi-reason-label&#x27;).hidden = next !== &#x27;single&#x27;;
        el(&#x27;mi-reason&#x27;).value = &#x27;&#x27;;
        el(&#x27;mi-confirm-button&#x27;).disabled = next === &#x27;single&#x27;;
        el(&#x27;mi-confirm-button&#x27;).textContent = discard ? &#x27;Discard sample import&#x27; : &#x27;Confirm sample submission&#x27;;
        el(&#x27;mi-confirm-note&#x27;).textContent = discard ? &#x27;Remove this import from the list. The source PDF and existing Action Builder person stay unchanged.&#x27; : &#x27;Design preview only. No Action Builder request will be made.&#x27;;
        notice(&#x27;&#x27;);
      }
      function render() {
        root.style.setProperty(&#x27;--mi-space&#x27;, appearance.spacing === &#x27;Compact&#x27; ? &#x27;14px&#x27; : &#x27;20px&#x27;);
        root.style.setProperty(&#x27;--mi-accent&#x27;, appearance.accent === &#x27;Teal&#x27; ? &#x27;light-dark(#126c69,#90d7cc)&#x27; : &#x27;light-dark(#2454cf,#98b7ff)&#x27;);
        root.style.setProperty(&#x27;--mi-tint&#x27;, appearance.accent === &#x27;Teal&#x27; ? &#x27;light-dark(#eaf6f3,#253f40)&#x27; : &#x27;light-dark(#edf2ff,#293e64)&#x27;);
        const pending = people.filter(p =&gt; p.status === &#x27;pending&#x27;).length;
        const held = people.filter(isHeld).length;
        el(&#x27;mi-total&#x27;).textContent = people.filter(p =&gt; p.status !== &#x27;discarded&#x27;).length + &#x27; people imported&#x27;;
        el(&#x27;mi-footer-status&#x27;).textContent = &#x27;Destination: Example local · Membership campaign&#x27;;
        el(&#x27;mi-batch-send&#x27;).textContent = &#x27;Check and submit batch&#x27;;
        el(&#x27;mi-batch-send&#x27;).disabled = pending === 0 || !!action;
        el(&#x27;mi-batch-send&#x27;).hidden = view !== &#x27;preview&#x27; || !!action;
        el(&#x27;mi-held-tab&#x27;).hidden = held === 0;
        el(&#x27;mi-held-tab&#x27;).textContent = &#x27;Needs review (&#x27;+held+&#x27;)&#x27;;
        el(&#x27;mi-send-tab&#x27;).disabled = !batchRun;
        el(&#x27;mi-sidebar-label&#x27;).textContent = view===&#x27;detail&#x27;?&#x27;Completed submissions&#x27;:&#x27;Needs your review&#x27;;
        renderLists();
        el(&#x27;mi-people&#x27;).replaceChildren();
        people.forEach((p,i) =&gt; {
          if (view===&#x27;detail&#x27; ? p.status!==&#x27;sent&#x27; : !isHeld(p)) return;
          const button = document.createElement(&#x27;button&#x27;); button.type=&#x27;button&#x27;; button.className=&#x27;mi-person&#x27;; button.setAttribute(&#x27;aria-pressed&#x27;, String(i===selected));
          const name = document.createElement(&#x27;strong&#x27;); name.textContent=p.name;
          const status = document.createElement(&#x27;span&#x27;); status.className=&#x27;mi-pill &#x27; + (p.status===&#x27;review&#x27;||p.status===&#x27;changed&#x27; ? &#x27;mi-warning&#x27;:&#x27;mi-good&#x27;); status.textContent=labels[p.status];
          button.append(name,status); button.addEventListener(&#x27;click&#x27;,()=&gt;{ selected=i; editing=false; el(&#x27;mi-checked&#x27;).checked=false; notice(&#x27;&#x27;); render(); }); el(&#x27;mi-people&#x27;).append(button);
        });
        const person = people[selected];
        el(&#x27;mi-name&#x27;).textContent=person.name; el(&#x27;mi-email&#x27;).textContent=person.email; el(&#x27;mi-phone&#x27;).textContent=person.phone;
        el(&#x27;mi-email-input&#x27;).value=person.email;
        el(&#x27;mi-status&#x27;).textContent=labels[person.status]; el(&#x27;mi-status&#x27;).className=&#x27;mi-pill &#x27; + (person.status===&#x27;review&#x27;||person.status===&#x27;changed&#x27; ? &#x27;mi-warning&#x27;:&#x27;mi-good&#x27;);
        el(&#x27;mi-receipt-id&#x27;).textContent=person.receipt;
        el(&#x27;mi-source&#x27;).textContent=&#x27;Source: &#x27;+person.name.replaceAll(&#x27; &#x27;,&#x27;-&#x27;)+&#x27;-ORGANIZED.pdf&#x27;;
        el(&#x27;mi-email&#x27;).hidden=editing; el(&#x27;mi-email-editor&#x27;).hidden=!editing; el(&#x27;mi-edit&#x27;).textContent=editing?&#x27;Save corrected email&#x27;:&#x27;Edit these details&#x27;;
        el(&#x27;mi-edit&#x27;).disabled=person.status===&#x27;sent&#x27;||person.status===&#x27;discarded&#x27;;
        el(&#x27;mi-match&#x27;).hidden=person.status!==&#x27;review&#x27;; el(&#x27;mi-clear&#x27;).hidden=true; el(&#x27;mi-recheck&#x27;).hidden=person.status!==&#x27;changed&#x27;; el(&#x27;mi-sent&#x27;).hidden=person.status!==&#x27;sent&#x27;;
        el(&#x27;mi-override&#x27;).hidden=person.status!==&#x27;review&#x27;; el(&#x27;mi-new-person&#x27;).hidden=person.status!==&#x27;review&#x27;; el(&#x27;mi-new-person&#x27;).disabled=!el(&#x27;mi-checked&#x27;).checked||editing;
        el(&#x27;mi-review-actions&#x27;).hidden=person.status===&#x27;sent&#x27;||person.status===&#x27;discarded&#x27;;
        el(&#x27;mi-recheck-button&#x27;).hidden=person.status!==&#x27;changed&#x27;;
        el(&#x27;mi-review-panel&#x27;).hidden=(view!==&#x27;review&#x27;&amp;&amp;view!==&#x27;detail&#x27;)||!!action; el(&#x27;mi-import-panel&#x27;).hidden=view!==&#x27;import&#x27;||!!action;
        el(&#x27;mi-preview-panel&#x27;).hidden=view!==&#x27;preview&#x27;||!!action; el(&#x27;mi-results-panel&#x27;).hidden=view!==&#x27;results&#x27;||!!action;
        el(&#x27;mi-import-tab&#x27;).setAttribute(&#x27;aria-current&#x27;,view===&#x27;import&#x27;?&#x27;step&#x27;:&#x27;false&#x27;); el(&#x27;mi-review-tab&#x27;).setAttribute(&#x27;aria-current&#x27;,view===&#x27;preview&#x27;&amp;&amp;!action?&#x27;step&#x27;:&#x27;false&#x27;); el(&#x27;mi-send-tab&#x27;).setAttribute(&#x27;aria-current&#x27;,view===&#x27;results&#x27;||view===&#x27;detail&#x27;?&#x27;step&#x27;:&#x27;false&#x27;); el(&#x27;mi-held-tab&#x27;).setAttribute(&#x27;aria-current&#x27;,view===&#x27;review&#x27;?&#x27;step&#x27;:&#x27;false&#x27;);
      }
      el(&#x27;mi-import-tab&#x27;).onclick=()=&gt;{ action=&#x27;&#x27;; el(&#x27;mi-confirm-panel&#x27;).hidden=true; view=&#x27;import&#x27;; render(); };
      el(&#x27;mi-review-tab&#x27;).onclick=()=&gt;{ action=&#x27;&#x27;; el(&#x27;mi-confirm-panel&#x27;).hidden=true; view=&#x27;preview&#x27;; render(); };
      el(&#x27;mi-send-tab&#x27;).onclick=()=&gt;{ action=&#x27;&#x27;; el(&#x27;mi-confirm-panel&#x27;).hidden=true; view=&#x27;results&#x27;; render(); };
      el(&#x27;mi-held-tab&#x27;).onclick=()=&gt;showHeld(); el(&#x27;mi-review-held&#x27;).onclick=()=&gt;showHeld();
      el(&#x27;mi-scan&#x27;).onclick=()=&gt;{ view=&#x27;preview&#x27;; notice(&#x27;Sample scan complete. Related paperwork is grouped; no real files were read.&#x27;); render(); };
      el(&#x27;mi-batch-send&#x27;).onclick=()=&gt;{
        people.filter(p=&gt;p.status===&#x27;pending&#x27;).forEach(p=&gt;{p.status=p.lookup===&#x27;match&#x27;?&#x27;review&#x27;:&#x27;sent&#x27;;});
        batchRun=true; view=&#x27;results&#x27;; notice(&#x27;Sample batch complete. This concept made no API requests.&#x27;); render();
      };
      el(&#x27;mi-checked&#x27;).onchange=()=&gt;{ el(&#x27;mi-new-person&#x27;).disabled=!el(&#x27;mi-checked&#x27;).checked||editing; };
      el(&#x27;mi-new-person&#x27;).onclick=()=&gt;{ openAction(&#x27;single&#x27;); render(); };
      el(&#x27;mi-discard&#x27;).onclick=()=&gt;{ openAction(&#x27;discard&#x27;); render(); };
      el(&#x27;mi-keep&#x27;).onclick=()=&gt;{ view=&#x27;results&#x27;; notice(&#x27;Kept for later review. Completed submissions remain complete.&#x27;); render(); };
      el(&#x27;mi-edit&#x27;).onclick=()=&gt;{
        if(editing) {
          const input=el(&#x27;mi-email-input&#x27;); if(!input.value.trim()||!input.checkValidity()) { input.reportValidity(); notice(&#x27;Enter a valid sample email.&#x27;); return; }
          if(people[selected].email!==input.value.trim()) { people[selected].email=input.value.trim(); people[selected].status=&#x27;changed&#x27;; el(&#x27;mi-checked&#x27;).checked=false; notice(&#x27;Sample correction saved. Previous checks no longer apply.&#x27;); }
        }
        editing=!editing; render();
      };
      el(&#x27;mi-recheck-button&#x27;).onclick=()=&gt;{ people[selected].status=&#x27;review&#x27;; notice(&#x27;Sample check complete. A possible existing person still needs review.&#x27;); render(); };
      el(&#x27;mi-reason&#x27;).oninput=()=&gt;{ el(&#x27;mi-confirm-button&#x27;).disabled=!el(&#x27;mi-reason&#x27;).value.trim(); };
      el(&#x27;mi-cancel&#x27;).onclick=()=&gt;{ action=&#x27;&#x27;; el(&#x27;mi-confirm-panel&#x27;).hidden=true; view=&#x27;review&#x27;; render(); };
      el(&#x27;mi-confirm-button&#x27;).onclick=()=&gt;{
        if(action===&#x27;single&#x27;&amp;&amp;!el(&#x27;mi-reason&#x27;).value.trim()) return;
        if(action===&#x27;single&#x27;) people[selected].status=&#x27;sent&#x27;;
        if(action===&#x27;discard&#x27;) { people[selected].status=&#x27;discarded&#x27;; const next=people.findIndex(p=&gt;p.status!==&#x27;discarded&#x27;); if(next!==-1) selected=next; }
        notice(action===&#x27;discard&#x27;?&#x27;Sample import discarded. Original documents stay unchanged.&#x27;:&#x27;Demo complete. No people were sent to Action Builder.&#x27;);
        action=&#x27;&#x27;; el(&#x27;mi-confirm-panel&#x27;).hidden=true; view=&#x27;results&#x27;; render();
      };
      render();
      if(globalThis.Tweak) { const tweak=new Tweak({container:root,onChange:render}); tweak.addSelect(appearance,&#x27;accent&#x27;,{label:&#x27;Accent color&#x27;,options:[&#x27;Blue&#x27;,&#x27;Teal&#x27;]}); tweak.addSelect(appearance,&#x27;spacing&#x27;,{label:&#x27;Spacing&#x27;,options:[&#x27;Comfortable&#x27;,&#x27;Compact&#x27;]}); }
    })();
  &lt;/script&gt;

(() =&gt; {
